<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuvvet ve Hareket Etkileşimli Simülasyonu</title>
<style>
:root{--fnet-color:#2e7d32;--font-main:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,.obj-item{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1e272e;font-family:var(--font-main);font-size:14px;color:#212121}
#viewport-wrapper{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#app-stage{width:1040px;height:590px;background:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);transform-origin:center center;display:flex;flex-direction:column}
#scene-section{position:relative;width:1040px;height:330px;flex-shrink:0;overflow:hidden;background:#81d4fa}
#sim-canvas{width:1040px;height:330px;display:block;cursor:crosshair;touch-action:none}
#control-panel{position:absolute;top:8px;left:8px;width:225px;background:linear-gradient(180deg,#f0f4c3,#dce775);border:2px solid #7cb342;border-radius:10px;padding:7px 9px;box-shadow:0 3px 8px rgba(0,0,0,.22);z-index:10;font-size:14px}
.chk-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;line-height:1.15}
.chk-row label{display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:600;font-size:14px;color:#1b5e20}
.chk-row input[type=checkbox]{width:16px;height:16px;accent-color:#2e7d32;cursor:pointer;margin:0}
.slider-box{margin-top:4px;padding-top:4px;border-top:1px solid rgba(0,0,0,.15);text-align:center}
.slider-title{font-weight:700;font-size:14px;color:#33691e;margin-bottom:2px}
.slider-labels{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#333}
.slider-box input[type=range]{width:100%;margin:2px 0;cursor:pointer;accent-color:#0288d1;height:16px}
#playback-controls{position:absolute;top:284px;left:8px;width:225px;display:flex;align-items:center;justify-content:space-between;z-index:10;gap:4px}
.round-btn{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;transition:transform .1s;padding:0}
.round-btn:active{transform:scale(.92)}
.btn-blue{background:radial-gradient(circle at 30% 30%,#64b5f6,#1976d2)}
.btn-orange{background:radial-gradient(circle at 30% 30%,#ffb74d,#e65100)}
.btn-green{background:radial-gradient(circle at 30% 30%,#81c784,#2e7d32)}
.btn-clean{flex:1;height:30px;border-radius:15px;border:1px solid #fff;background:linear-gradient(180deg,#ef5350,#c62828);color:#fff;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.25);padding:0 4px}
#draw-hint{position:absolute;bottom:4px;left:236px;right:12px;background:rgba(255,255,255,.94);padding:2px 10px;border-radius:10px;font-size:13px;font-weight:600;color:#0d47a1;border:1px solid #90caf9;pointer-events:none;z-index:6;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#middle-section{width:1040px;height:212px;display:flex;border-top:2px solid #5d4037;border-bottom:2px solid #5d4037;background:#fff;flex-shrink:0}
#objects-area{width:420px;height:100%;background:#c59b6d;display:flex;border-right:3px solid #5d4037;padding:8px;flex-direction:column;justify-content:space-between}
.obj-compartment{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.obj-title{text-align:center;font-weight:800;font-size:14px;color:#212121;margin-bottom:2px}
.obj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:center;height:125px}
.obj-item{background:rgba(255,255,255,.35);border:2px solid #6d4c41;border-radius:6px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;transition:all .15s}
.obj-item:hover{background:rgba(255,255,255,.65);transform:translateY(-2px)}
.obj-item.active{background:#fff9c4;border-color:#d84315;box-shadow:0 0 0 2px #ff8a65}
.obj-name{font-weight:700;font-size:13px;margin-top:4px;text-align:center;color:#212121}
.obj-mass-tag{font-size:13px;font-weight:800;color:#b71c1c;background:rgba(255,255,255,.8);padding:0 4px;border-radius:4px;margin-top:2px}
#table-area{width:620px;height:100%;display:flex;flex-direction:column;background:#fff}
#table-toolbar{height:30px;background:#eceff1;border-bottom:1px solid #b0bec5;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.mode-tabs{display:flex;gap:4px}
.mode-btn{padding:2px 8px;font-size:13px;font-weight:700;border:1px solid #78909c;border-radius:4px;background:#fff;cursor:pointer;color:#37474f}
.mode-btn.active{background:#1565c0;color:#fff;border-color:#0d47a1}
#check-table-btn{background:#2e7d32;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:13px;font-weight:700;cursor:pointer;display:none}
#table-feedback{font-size:13px;font-weight:700;color:#d84315;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.table-container-scroll{width:100%;height:calc(100% - 30px);overflow:auto}
#force-table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13px}
#force-table th,#force-table td{border:1px solid #424242;padding:2px 5px;text-align:center;vertical-align:middle;height:28px;white-space:nowrap}
#force-table th{background:#f5f5f5;font-weight:800;color:#212121;position:sticky;top:0;z-index:2}
#force-table th:first-child{min-width:155px;left:0;z-index:3;background:#e0e0e0}
.tbl-select,.tbl-input{width:92%;font-size:13px;font-weight:600;padding:1px 2px;border:1px solid #90a4ae;border-radius:3px;text-align:center;background:#fff}
.cell-correct{background-color:#c8e6c9!important;color:#1b5e20!important;font-weight:700}
.cell-wrong{background-color:#ffcdd2!important;color:#b71c1c!important;font-weight:700}
#bottom-section{width:1040px;height:48px;background:#eceff1;display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex-shrink:0;border-top:1px solid #cfd8dc;position:relative}
.module-btn{background:linear-gradient(130deg,#1e88e5,#1565c0);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);display:flex;align-items:center;gap:4px}
.module-btn:hover{background:linear-gradient(130deg,#1565c0,#0d47a1)}
#module-modal-panel{position:absolute;bottom:48px;left:0;width:1040px;height:260px;background:#fff;border-top:3px solid #1565c0;box-shadow:0 -5px 20px rgba(0,0,0,.25);z-index:25;display:none;flex-direction:column;padding:10px 15px;overflow-y:auto}
.mod-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b0bec5;padding-bottom:5px;margin-bottom:8px}
.mod-title{font-size:16px;font-weight:800;color:#0d47a1}
.mod-close{background:#d32f2f;color:#fff;border:none;border-radius:4px;width:24px;height:24px;font-weight:700;cursor:pointer}
.elements-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.element-card{background:#f1f8e9;border:2px solid #7cb342;border-radius:8px;padding:8px;text-align:center}
.element-card h4{margin:0 0 4px;color:#33691e;font-size:14px}
.element-card p{margin:0;font-size:12px;color:#37474f}

/* Akıllı cihaz / dikey ekran düzeni */
@media (max-width:820px),(orientation:portrait){
html,body{height:auto;min-height:100%;overflow-y:auto}
#viewport-wrapper{display:block;height:auto;overflow:visible}
#app-stage{width:100%;height:auto;transform:none!important;display:block;overflow:visible}
#scene-section{width:100%;height:auto;overflow:visible;display:flex;flex-direction:column}
#sim-canvas{width:100%;height:auto;flex-shrink:0;order:1}
#playback-controls{position:static;width:auto;margin:8px;order:2;gap:8px}
#draw-hint{position:static;margin:0 8px 8px;font-size:12px;order:3}
#control-panel{position:static;width:auto;margin:0 8px 8px;order:4;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
#control-panel .slider-box{grid-column:1/-1}
.chk-row input[type=checkbox]{width:22px;height:22px}
.slider-box input[type=range]{height:28px}
.round-btn{width:44px;height:44px;font-size:18px}
.btn-clean{height:44px;font-size:14px}
#middle-section{width:100%;height:auto;flex-direction:column}
#objects-area{width:100%;height:auto;border-right:0;border-bottom:3px solid #5d4037}
.obj-compartment{height:auto;gap:6px}
.obj-grid{height:auto}
.obj-item{height:96px}
#table-area{width:100%;height:auto}
#table-toolbar{height:auto;min-height:40px;padding:4px 8px;flex-wrap:wrap;gap:6px}
.mode-btn,#check-table-btn{padding:8px 12px;font-size:14px}
.table-container-scroll{height:auto;max-height:280px}
#force-table th:first-child{min-width:110px}
.tbl-select,.tbl-input{font-size:16px;min-height:34px}
#bottom-section{width:100%;height:auto;flex-wrap:wrap;gap:6px;padding:8px}
.module-btn{flex:1 1 45%;justify-content:center;padding:10px;font-size:14px}
#module-modal-panel{position:fixed;left:0;right:0;bottom:0;width:100%;height:70vh;z-index:50}
.elements-grid{grid-template-columns:repeat(2,1fr)}
.mod-close{width:36px;height:36px}
.assess-textarea{font-size:16px!important;height:70px!important}
}
</style>
</head>
<body>
<div id="viewport-wrapper">
<div id="app-stage">

<div id="scene-section">
<canvas id="sim-canvas" width="1040" height="330"></canvas>
<div id="control-panel">
<div class="chk-row"><label><input type="checkbox" id="chk-forces" checked> Kuvvetler</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-net" checked> Net Kuvvet</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-values" checked> Büyüklükleri Göster</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-Direction" checked> Doğrultu Çizgisi</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-direction-var" checked> Yön</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-masses" checked> Kütleleri Göster</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-speed" checked> Hız Göstergesi</label></div>
<div class="chk-row"><label><input type="checkbox" id="chk-freedir" checked> Serbest Yön (Açılı)</label></div>
<div class="slider-box">
<div class="slider-title">Sürtünme Kuvveti (<span id="mu-label">μ = 0.000</span>)</div>
<div class="slider-labels"><span>Az</span><span>Çok</span></div>
<input type="range" id="slider-friction" min="0" max="0.05" step="0.005" value="0">
</div>
</div>
<div id="playback-controls">
<button id="btn-play-pause" class="round-btn btn-blue" title="Başlat / Duraklat">⏸</button>
<button id="btn-add-force" class="round-btn btn-green" title="Yeni Kuvvet Ekle (+)">➕</button>
<button id="btn-reset" class="round-btn btn-orange" title="Sıfırla">↻</button>
<button id="btn-clear-vectors" class="btn-clean" title="Tüm Vektörleri Sil">Temizle</button>
</div>
<div id="draw-hint">💡 Cismin kenarından sürükleyerek kuvvet çizin (0–20 N). Silmek için kuvvete çift dokunun (bilgisayarda sağ tık).</div>
</div>

<div id="middle-section">
<div id="objects-area">
<div class="obj-compartment">
<div class="obj-title">CİSİMLER (Seç)</div>
<div class="obj-grid">
<div class="obj-item active" data-type="crate" data-mass="50" data-name="Sandık">
<svg width="42" height="42" viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" fill="#c59b6d" stroke="#5d4037" stroke-width="3"/><line x1="4" y1="4" x2="56" y2="56" stroke="#8d6e63" stroke-width="4"/><line x1="56" y1="4" x2="4" y2="56" stroke="#8d6e63" stroke-width="4"/></svg>
<div class="obj-name">Sandık</div><div class="obj-mass-tag">50 kg</div>
</div>
<div class="obj-item" data-type="books" data-mass="25" data-name="Kitap Yığını">
<svg width="42" height="42" viewBox="0 0 60 60"><rect x="8" y="38" width="44" height="12" rx="2" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/><rect x="10" y="26" width="40" height="12" rx="2" fill="#e53935" stroke="#b71c1c" stroke-width="2"/><rect x="12" y="14" width="36" height="12" rx="2" fill="#43a047" stroke="#1b5e20" stroke-width="2"/></svg>
<div class="obj-name">Kitaplar</div><div class="obj-mass-tag">25 kg</div>
</div>
<div class="obj-item" data-type="fridge" data-mass="100" data-name="Buzdolabı">
<svg width="42" height="42" viewBox="0 0 60 60"><rect x="14" y="4" width="32" height="52" rx="3" fill="#eceff1" stroke="#455a64" stroke-width="3"/><line x1="14" y1="24" x2="46" y2="24" stroke="#455a64" stroke-width="2"/></svg>
<div class="obj-name">Buzdolabı</div><div class="obj-mass-tag">100 kg</div>
</div>
<div class="obj-item" data-type="safe" data-mass="100" data-name="Çelik Kasa">
<svg width="42" height="42" viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" rx="4" fill="#546e7a" stroke="#263238" stroke-width="3"/><circle cx="34" cy="30" r="9" fill="#cfd8dc" stroke="#263238" stroke-width="2"/></svg>
<div class="obj-name">Kasa</div><div class="obj-mass-tag">100 kg</div>
</div>
</div>
<div style="font-size:13px;font-weight:600;color:#3e2723;text-align:center">Seçili: <span id="active-obj-label">Sandık (50 kg)</span></div>
</div>
</div>
<div id="table-area">
<div id="table-toolbar">
<div class="mode-tabs">
<button class="mode-btn active" id="btn-mode-obs">👁 Gözlem</button>
<button class="mode-btn" id="btn-mode-stu">✏️ Öğrenci</button>
</div>
<span id="table-feedback"></span>
<button id="check-table-btn">✓ Kontrol</button>
</div>
<div class="table-container-scroll">
<table id="force-table"><thead id="force-table-head"></thead><tbody id="force-table-body"></tbody></table>
</div>
</div>
</div>

<div id="bottom-section">
<button class="module-btn" id="mod-btn-1">📘 1. Elemanlar</button>
<button class="module-btn" id="mod-btn-2">⚖️ 2. Bileşke</button>
<button class="module-btn" id="mod-btn-3">🔄 3. Dengelenmiş</button>
<button class="module-btn" id="mod-btn-4">📝 4. Değerlendirme</button>
<div id="module-modal-panel">
<div class="mod-header"><span class="mod-title" id="mod-panel-title">Modül Başlığı</span><button class="mod-close" id="mod-panel-close">✕</button></div>
<div id="mod-panel-body" style="font-size:13px;color:#333"></div>
</div>
</div>

</div>
</div>
<script>
const DESIGN_W = 1040, DESIGN_H = 590, CANVAS_H = 330, GROUND_Y = 278, GRAVITY = 10;
let CANVAS_W = 1040;
const PX_PER_NEWTON = 8;      // 20 N = 160 px
const MAX_FORCE = 20;
const DEFAULT_FORCE = 10;
const TIME_SCALE = 2;
const r1 = x => Math.round(x * 10) / 10;

const mq = window.matchMedia('(max-width: 820px), (orientation: portrait)');
const COARSE = window.matchMedia('(pointer: coarse)').matches;
const HIT = COARSE ? 26 : 14;
const EDGE_PAD = COARSE ? 24 : 12;

const PALETTE = [
  { name: '1. Kuvvet', hex: '#1565c0' }, { name: '2. Kuvvet', hex: '#c62828' },
  { name: '3. Kuvvet', hex: '#7b1fa2' }, { name: '4. Kuvvet', hex: '#00838f' },
  { name: '5. Kuvvet', hex: '#e65100' }, { name: '6. Kuvvet', hex: '#4e342e' }
];

const state = {
  running: true, autoResumeAfterDraw: true, currentScale: 1,
  objectType: 'crate', objectName: 'Sandık', mass: 50, velocity: 0, groundOffset: 0,
  mu: 0, frictionForce: 0, fNetX: 0, netForceX: 0, netForceY: 0, netForceMag: 0, netAngleDeg: 0,
  showForces: true, showNetForce: true, showValuesOnHover: true, showDirectionLine: true,
  showDirectionVar: true, showMasses: true, showSpeedGauge: true, freeDirection: true,
  forces: [],
  interaction: { mode: null, targetId: null, wasRunning: true, hoverId: null },
  tableMode: 'observation', activeModule: null,
  assessment: { answers: {}, teacherView: false }
};

const appStage = document.getElementById('app-stage');
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');

function updateStageScale() {
  if (mq.matches) { appStage.style.transform = 'none'; state.currentScale = 1; return; }
  state.currentScale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
  appStage.style.transform = `scale(${state.currentScale})`;
}
function setupCanvasDPI() {
  CANVAS_W = mq.matches ? 520 : 1040;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CANVAS_W * dpr;
  canvas.height = CANVAS_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { updateStageScale(); setupCanvasDPI(); });
updateStageScale();
setupCanvasDPI();

function syncPlayBtn() {
  document.getElementById('btn-play-pause').textContent = state.running ? '⏸' : '▶';
}

function getCardinalDirection(deg) {
  let n = deg % 360; if (n < 0) n += 360;
  if (n >= 337.5 || n < 22.5) return 'Doğu';
  if (n < 67.5) return 'Kuzeydoğu';
  if (n < 112.5) return 'Kuzey';
  if (n < 157.5) return 'Kuzeybatı';
  if (n < 202.5) return 'Batı';
  if (n < 247.5) return 'Güneybatı';
  if (n < 292.5) return 'Güney';
  return 'Güneydoğu';
}

function getForceComponents(f) {
  if (!f || !f.active || f.mag <= 0) return { fx: 0, fy: 0 };
  const rad = (f.angleDeg * Math.PI) / 180;
  const fx = f.mag * Math.cos(rad), fy = f.mag * Math.sin(rad);
  return { fx: Math.abs(fx) < 1e-4 ? 0 : fx, fy: Math.abs(fy) < 1e-4 ? 0 : fy };
}

function stepPhysics(dt) {
  let totalFx = 0, totalFy = 0;
  state.forces.forEach(f => { const c = getForceComponents(f); totalFx += c.fx; totalFy += c.fy; });

  state.netForceX = r1(totalFx);
  state.netForceY = r1(totalFy);
  state.netForceMag = r1(Math.hypot(totalFx, totalFy));
  let netAngle = (Math.atan2(totalFy, totalFx) * 180) / Math.PI;
  if (netAngle < 0) netAngle += 360;
  state.netAngleDeg = Math.round(netAngle);

  const normalForce = Math.max(0, state.mass * GRAVITY - totalFy);
  const maxStaticFriction = state.mu * normalForce;
  const kineticFrictionMag = state.mu * 0.85 * normalForce;

  let fFriction = 0, fNetX = 0;

  if (Math.abs(state.velocity) < 0.005) {
    state.velocity = 0;
    if (Math.abs(totalFx) <= maxStaticFriction) {
      fFriction = -totalFx; fNetX = 0;
    } else {
      const dir = Math.sign(totalFx);
      fFriction = -dir * r1(kineticFrictionMag);
      fNetX = totalFx + fFriction;
      state.velocity += (fNetX / state.mass) * dt * TIME_SCALE;
    }
  } else {
    const velDir = Math.sign(state.velocity);
    fFriction = -velDir * r1(kineticFrictionMag);
    fNetX = totalFx + fFriction;
    const nextVel = state.velocity + (fNetX / state.mass) * dt * TIME_SCALE;
    if (Math.sign(nextVel) !== velDir && Math.abs(totalFx) <= maxStaticFriction) {
      state.velocity = 0; fFriction = -totalFx; fNetX = 0;
    } else {
      state.velocity = nextVel;
    }
  }

  if (state.velocity > 40) state.velocity = 40;
  if (state.velocity < -40) state.velocity = -40;

  state.frictionForce = r1(fFriction);
  state.fNetX = fNetX;

  if (Math.abs(state.velocity) < 0.01) state.velocity = 0;
  else {
    state.groundOffset = (state.groundOffset - state.velocity * 10 * dt) % 48;
    if (state.groundOffset < 0) state.groundOffset += 48;
  }

  const sig = [state.netForceMag, state.netAngleDeg, r1(state.fNetX), Math.sign(state.velocity), Math.abs(state.velocity) >= 0.01].join();
  if (state.tableMode === 'observation' && sig !== state._sig) { state._sig = sig; renderForceTable(); }
}

function getObjectBox() {
  let w = 88, h = 88;
  if (state.objectType === 'books') { w = 84; h = 64; }
  else if (state.objectType === 'fridge') { w = 76; h = 114; }
  else if (state.objectType === 'safe') { w = 86; h = 84; }
  const cx = CANVAS_W / 2, topY = GROUND_Y - h;
  return { x: cx - w / 2, y: topY, w, h, cx, cy: topY + h / 2 };
}

function drawScene() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#0288d1'); g.addColorStop(0.65, '#81d4fa'); g.addColorStop(1, '#e1f5fe');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CANVAS_W, GROUND_Y);
  drawCloud(310, 82, 1.15); drawCloud(565, 76, 0.95);
  drawMountainRange(320, GROUND_Y, 175, 58); drawMountainRange(845, GROUND_Y, 175, 55);
  if (state.showSpeedGauge) drawSpeedometer(CANVAS_W < 1000 ? CANVAS_W - 66 : 388, 76, 52);
  drawBrickGround();
  const box = getObjectBox();
  drawActiveObject(box);
  drawAllForceVectors(box);
}

function drawCloud(cx, cy, s) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = '#cfd8dc'; ctx.beginPath();
  ctx.arc(-45, 10, 26, 0, 6.2832); ctx.arc(-10, 14, 34, 0, 6.2832); ctx.arc(32, 12, 28, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.arc(-48, 2, 26, 0, 6.2832); ctx.arc(-15, -10, 34, 0, 6.2832); ctx.arc(25, -8, 30, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawMountainRange(bx, by, w, h) {
  ctx.save(); ctx.fillStyle = '#9e9d89'; ctx.beginPath();
  ctx.moveTo(bx, by); ctx.lineTo(bx + w * 0.35, by - h); ctx.lineTo(bx + w * 0.7, by); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#616161'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}

function drawSpeedometer(cx, cy, r) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#37474f'; ctx.stroke();
  ctx.fillStyle = '#212121'; ctx.font = 'bold 14px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('Hız', cx, cy - 12);
  const sp = Math.abs(state.velocity);
  ctx.fillStyle = '#0d47a1'; ctx.fillText(`${sp.toFixed(1)} m/s`, cx, cy + 28);
  const a = Math.PI * 0.8 + (Math.min(sp, 10) / 10) * (Math.PI * 1.4);
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12));
  ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}

function drawBrickGround() {
  const tw = 48, gh = CANVAS_H - GROUND_Y;
  ctx.fillStyle = '#5d4037'; ctx.fillRect(0, GROUND_Y, CANVAS_W, 5);
  ctx.fillStyle = '#a1887f'; ctx.fillRect(0, GROUND_Y + 5, CANVAS_W, gh - 5);
  const off = state.groundOffset;
  for (let x = -tw + off; x < CANVAS_W + tw; x += tw) {
    drawBrick(x, GROUND_Y + 7, tw - 4, 20);
    drawBrick(x - tw / 2, GROUND_Y + 30, tw - 4, 18);
  }
}
function drawBrick(x, y, w, h) {
  ctx.fillStyle = '#8d5524'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
}

function drawActiveObject(box) {
  ctx.save();
  const { x, y, w, h, cx, cy } = box;
  if (state.objectType === 'crate') {
    ctx.fillStyle = '#c89d66'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  } else if (state.objectType === 'books') {
    ctx.fillStyle = '#1e88e5'; ctx.fillRect(x + 6, y + 42, w - 12, 16);
    ctx.fillStyle = '#e53935'; ctx.fillRect(x + 4, y + 22, w - 8, 18);
    ctx.fillStyle = '#43a047'; ctx.fillRect(x + 8, y + 4, w - 16, 16);
  } else if (state.objectType === 'fridge') {
    ctx.fillStyle = '#eceff1'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  } else if (state.objectType === 'safe') {
    ctx.fillStyle = '#607d8b'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#263238'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  }
  if (state.showMasses) {
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = '#212121'; ctx.lineWidth = 1.5;
    ctx.fillRect(cx - 29, cy - 11, 58, 22); ctx.strokeRect(cx - 29, cy - 11, 58, 22);
    ctx.fillStyle = '#212121'; ctx.font = 'bold 13px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${state.mass} kg`, cx, cy);
  }
  ctx.restore();
}

function getVectorEndpoints(f, box) {
  let sx, sy;
  const edge = f.edge || 'left', ratio = f.edgeRatio !== undefined ? f.edgeRatio : 0.5;
  if (edge === 'left') { sx = box.x; sy = box.y + box.h * ratio; }
  else if (edge === 'right') { sx = box.x + box.w; sy = box.y + box.h * ratio; }
  else if (edge === 'top') { sx = box.x + box.w * ratio; sy = box.y; }
  else { sx = box.x + box.w * ratio; sy = box.y + box.h; }
  const len = f.mag * PX_PER_NEWTON, rad = (f.angleDeg * Math.PI) / 180;
  return { startX: sx, startY: sy, endX: sx + len * Math.cos(rad), endY: sy - len * Math.sin(rad) };
}

function drawAllForceVectors(box) {
  const badges = [], segs = [];
  if (state.showForces) {
    state.forces.forEach((f, idx) => {
      if (!(f.active && f.mag > 0)) return;
      const { startX, startY, endX, endY } = getVectorEndpoints(f, box);
      if (state.showDirectionLine) {
        ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = f.color; ctx.lineWidth = 1.2; ctx.beginPath();
        const rad = (f.angleDeg * Math.PI) / 180, ext = 350;
        ctx.moveTo(startX - Math.cos(rad) * ext, startY + Math.sin(rad) * ext);
        ctx.lineTo(endX + Math.cos(rad) * ext, endY - Math.sin(rad) * ext);
        ctx.stroke(); ctx.restore();
      }
      drawArrowPrimitive(startX, startY, endX, endY, f.color, 5);
      segs.push({ a: { x: startX, y: startY }, b: { x: endX, y: endY } });
      ctx.save(); ctx.beginPath(); ctx.arc(startX, startY, 5, 0, 6.2832);
      ctx.fillStyle = '#b71c1c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); ctx.restore();

      const it = state.interaction;
      const hov = it.hoverId === f.id || it.targetId === f.id;
      if (hov || it.mode === 'drawing') {
        ctx.save(); ctx.beginPath(); ctx.arc(endX, endY, 6, 0, 6.2832);
        ctx.fillStyle = '#ffeb3b'; ctx.fill(); ctx.strokeStyle = f.color; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      }
      if (state.showValuesOnHover || hov || it.mode === 'drawing') {
        badges.push({ x: endX, y: endY, ang: f.angleDeg, text: `${idx + 1}. Kuvvet: ${f.mag} N`, color: f.color });
      }
    });

    if (Math.abs(state.frictionForce) > 0) {
      const fl = Math.abs(state.frictionForce) * PX_PER_NEWTON, dir = Math.sign(state.frictionForce);
      drawArrowPrimitive(box.cx, GROUND_Y - 2, box.cx + dir * fl, GROUND_Y - 2, '#ef6c00', 4);
      if (state.showValuesOnHover) drawValueBadge(box.cx + dir * fl, GROUND_Y + 16, `Fs = ${Math.abs(state.frictionForce)} N`, '#e65100', true);
    }
  }

  if (state.showNetForce) {
    const netY = box.y - 48, nl = state.netForceMag * PX_PER_NEWTON, nr = (state.netAngleDeg * Math.PI) / 180;
    const ex = box.cx + nl * Math.cos(nr), ey = netY - nl * Math.sin(nr);
    if (state.netForceMag > 0) {
      drawArrowPrimitive(box.cx, netY, ex, ey, '#2e7d32', 6);
      segs.push({ a: { x: box.cx, y: netY }, b: { x: ex, y: ey } });
      if (state.showValuesOnHover || state.interaction.hoverId === 'net') badges.push({ x: ex, y: ey, ang: state.netAngleDeg, text: `Bileşke Kuvvet = ${state.netForceMag} N`, color: '#1b5e20' });
    } else if (state.showValuesOnHover) {
      drawValueBadge(box.cx, netY - 14, 'Bileşke Kuvvet = 0 N', '#2e7d32');
    }
  }
  // Bilgi kutucukları en son çizilir; vektörün doğrultusunda, ucunun ilerisine yerleşir
  const placed = [];
  badges.forEach(b => placeAlignedBadge(b, placed, segs));
}

function placeAlignedBadge(b, placed, segs) {
  ctx.save(); ctx.font = 'bold 14px Segoe UI';
  const bw = ctx.measureText(b.text).width + 14, bh = 22;
  ctx.restore();
  const rad = (b.ang * Math.PI) / 180, ux = Math.cos(rad), uy = -Math.sin(rad);
  const px = -uy, py = ux;
  const halfU = Math.abs(ux) * bw / 2 + Math.abs(uy) * bh / 2;
  const halfP = Math.abs(px) * bw / 2 + Math.abs(py) * bh / 2;
  const clampRect = (cx, cy) => ({
    x: Math.max(10, Math.min(CANVAS_W - bw - 10, cx - bw / 2)),
    y: Math.max(8, Math.min(GROUND_Y - 28, cy - bh / 2)), w: bw, h: bh
  });
  const segHits = (sg, r) => {
    for (let i = 0; i <= 14; i++) {
      const x = sg.a.x + (sg.b.x - sg.a.x) * i / 14, y = sg.a.y + (sg.b.y - sg.a.y) * i / 14;
      if (x > r.x - 3 && x < r.x + r.w + 3 && y > r.y - 3 && y < r.y + r.h + 3) return true;
    }
    return false;
  };
  const hits = r => placed.some(p => r.x < p.x + p.w + 4 && r.x + r.w + 4 > p.x && r.y < p.y + p.h + 4 && r.y + r.h + 4 > p.y) || segs.some(sg => segHits(sg, r));

  const cands = [];
  for (let k = 0; k < 6; k++) { const d = halfU + 8 + k * 14; cands.push([b.x + ux * d, b.y + uy * d]); }
  for (let k = 0; k < 3; k++) {
    const d = halfP + 8 + k * 14;
    cands.push([b.x + px * d + ux * halfU, b.y + py * d + uy * halfU]);
    cands.push([b.x - px * d + ux * halfU, b.y - py * d + uy * halfU]);
  }
  let rect = null;
  for (const [cx, cy] of cands) { const r = clampRect(cx, cy); if (!hits(r)) { rect = r; break; } }
  if (!rect) rect = clampRect(cands[0][0], cands[0][1]);
  placed.push(rect);
  drawValueBadge(rect.x + bw / 2, rect.y + bh / 2, b.text, b.color);
}

function drawArrowPrimitive(x1, y1, x2, y2, color, lw) {
  const hl = 12, a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hl * 0.7, y2 - Math.sin(a) * hl * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(a - Math.PI / 6), y2 - hl * Math.sin(a - Math.PI / 6));
  ctx.lineTo(x2 - hl * Math.cos(a + Math.PI / 6), y2 - hl * Math.sin(a + Math.PI / 6));
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawValueBadge(x, y, text, bc, inGround = false) {
  ctx.save(); ctx.font = 'bold 14px Segoe UI';
  const bw = ctx.measureText(text).width + 14, bh = 22;
  const bx = Math.max(10, Math.min(CANVAS_W - bw - 10, x - bw / 2));
  const by = Math.max(8, Math.min(inGround ? GROUND_Y - 26 : GROUND_Y - 28, y - bh / 2));
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = bc; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = bc; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + bw / 2, by + bh / 2); ctx.restore();
}

function getCanvasCoords(evt) {
  const r = canvas.getBoundingClientRect();
  return { x: (evt.clientX - r.left) * (CANVAS_W / r.width), y: (evt.clientY - r.top) * (CANVAS_H / r.height) };
}

function distToSegment(p, a, b) {
  const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
  if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
}

function findHoveredForce(pt, box) {
  for (const f of state.forces) {
    if (!f.active || f.mag <= 0) continue;
    const { startX, startY, endX, endY } = getVectorEndpoints(f, box);
    const d = distToSegment(pt, { x: startX, y: startY }, { x: endX, y: endY });
    if (d <= HIT || Math.hypot(pt.x - endX, pt.y - endY) <= HIT + 2) return f.id;
  }
  return null;
}

canvas.addEventListener('contextmenu', (evt) => {
  evt.preventDefault();
  const fId = findHoveredForce(getCanvasCoords(evt), getObjectBox());
  if (fId) {
    state.forces = state.forces.filter(f => f.id !== fId);
    stepPhysics(0); renderForceTable(); drawScene();
  }
});

let lastTap = { id: null, t: 0 };

canvas.addEventListener('pointerdown', (evt) => {
  if (evt.button === 2) return;
  const pt = getCanvasCoords(evt), box = getObjectBox();

  const fId = findHoveredForce(pt, box);
  if (fId) {
    const now = Date.now();
    if (lastTap.id === fId && now - lastTap.t < 350) {      // çift dokunma = sil
      state.forces = state.forces.filter(f => f.id !== fId);
      lastTap = { id: null, t: 0 };
      stepPhysics(0); renderForceTable(); drawScene();
      return;
    }
    lastTap = { id: fId, t: now };
    state.interaction.mode = 'editing';
    state.interaction.targetId = fId;
    state.interaction.wasRunning = state.running;
    state.running = false;
    canvas.setPointerCapture(evt.pointerId);
    return;
  }

  const pad = EDGE_PAD;
  if (pt.x >= box.x - pad && pt.x <= box.x + box.w + pad && pt.y >= box.y - pad && pt.y <= box.y + box.h + pad) {
    const dL = Math.abs(pt.x - box.x), dR = Math.abs(pt.x - (box.x + box.w));
    const dT = Math.abs(pt.y - box.y), dB = Math.abs(pt.y - (box.y + box.h));
    const clamp = v => Math.max(0.1, Math.min(0.9, v));
    let edge, ratio, angle;
    const m = Math.min(dL, dR, dT, dB);
    if (m === dL) { edge = 'left'; ratio = clamp((pt.y - box.y) / box.h); angle = 0; }
    else if (m === dR) { edge = 'right'; ratio = clamp((pt.y - box.y) / box.h); angle = 180; }
    else if (m === dT) { edge = 'top'; ratio = clamp((pt.x - box.x) / box.w); angle = 270; }
    else { edge = 'bottom'; ratio = clamp((pt.x - box.x) / box.w); angle = 90; }

    const newId = 'f_' + Date.now();
    state.forces.push({
      id: newId, active: true, mag: DEFAULT_FORCE, angleDeg: angle, edge, edgeRatio: ratio,
      color: PALETTE[state.forces.length % PALETTE.length].hex
    });
    state.interaction.mode = 'drawing';
    state.interaction.targetId = newId;
    state.interaction.wasRunning = state.running;
    state.running = false;
    canvas.setPointerCapture(evt.pointerId);
  }
});

canvas.addEventListener('pointermove', (evt) => {
  const pt = getCanvasCoords(evt), box = getObjectBox();
  const hovered = findHoveredForce(pt, box);
  if (hovered !== state.interaction.hoverId) { state.interaction.hoverId = hovered; drawScene(); }
  canvas.style.cursor = hovered ? 'grab' : 'crosshair';
  if (!state.interaction.mode) return;

  const f = state.forces.find(i => i.id === state.interaction.targetId);
  if (!f) return;
  const { startX, startY } = getVectorEndpoints(f, box);
  const dx = pt.x - startX, dy = startY - pt.y;

  const rawMag = Math.min(MAX_FORCE, Math.round(Math.hypot(dx, dy) / PX_PER_NEWTON));
  let deg = (Math.atan2(dy, dx) * 180) / Math.PI;
  if (deg < 0) deg += 360;
  if (!state.freeDirection) deg = (Math.round(deg / 90) * 90) % 360;

  f.mag = rawMag;
  f.angleDeg = Math.round(deg);
  stepPhysics(0);
  drawScene();
});

function finishInteraction() {
  if (!state.interaction.mode) return;
  state.interaction.mode = null;
  state.interaction.targetId = null;
  state.running = state.autoResumeAfterDraw ? true : state.interaction.wasRunning;
  syncPlayBtn();
  renderForceTable();
}
canvas.addEventListener('pointerup', finishInteraction);
canvas.addEventListener('pointercancel', finishInteraction);

function renderForceTable() {
  const thead = document.getElementById('force-table-head');
  const tbody = document.getElementById('force-table-body');
  const af = state.forces.filter(f => f.active && f.mag > 0);

  let head = '<tr><th>Kuvvetin Özellikleri</th>';
  af.forEach((f, i) => { head += `<th style="color:${f.color}">${i + 1}. Kuvvet</th>`; });
  head += '<th style="color:var(--fnet-color)">Bileşke (Net) Kuvvet</th></tr>';
  thead.innerHTML = head;

  if (af.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;padding:15px;color:#666">Cismin kenar çizgilerine dokunarak/tıklayarak kuvvet ekleyin.</td></tr>';
    return;
  }

  const netMagStr = `${state.netForceMag} N`;
  const showDir = state.showDirectionVar, showLine = state.showDirectionLine;
  const edgeName = e => e === 'left' ? 'Sol Kenar' : e === 'right' ? 'Sağ Kenar' : e === 'top' ? 'Üst Kenar' : 'Alt Kenar';
  const lineName = a => (a === 0 || a === 180 || a === 360) ? 'Yatay' : (a === 90 || a === 270) ? 'Düşey' : 'Eğik';

  let appRow = '<tr><th>Uygulama Noktası</th>';
  let lineRow = showLine ? '<tr><th>Doğrultu</th>' : '';
  let dirRow = showDir ? '<tr><th>Yön</th>' : '';
  let magRow = '<tr><th>Büyüklük</th>';

  if (state.tableMode === 'observation') {
    af.forEach(f => {
      appRow += `<td>${edgeName(f.edge)}</td>`;
      if (showLine) lineRow += `<td>${lineName(f.angleDeg)}</td>`;
      if (showDir) dirRow += `<td><b>${getCardinalDirection(f.angleDeg)}</b></td>`;
      magRow += `<td><b>${f.mag} N</b></td>`;
    });
    appRow += '<td>Cismin Merkezi</td>';
    if (showLine) lineRow += '<td>Bileşke Eksen</td></tr>';
    if (showDir) dirRow += `<td><b>${getCardinalDirection(state.netAngleDeg)}</b></td></tr>`;
    magRow += `<td><b>${netMagStr}</b></td>`;

    let effect = 'Cisim durgun kalır';
    const aNet = state.fNetX || 0;
    if (Math.abs(aNet) > 0.05) effect = (state.velocity !== 0 && Math.sign(aNet) !== Math.sign(state.velocity)) ? 'Yavaşlar' : 'Hızlanır';
    else if (Math.abs(state.velocity) >= 0.01) effect = 'Sabit hızla hareket eder';

    tbody.innerHTML = `${appRow}</tr>${lineRow}${dirRow}${magRow}</tr>
      <tr><th>Kuvvetin Etkisi</th><td colspan="${af.length + 1}" style="font-weight:800;color:#0d47a1;background:#e3f2fd">${effect}</td></tr>`;
    return;
  }

  af.forEach(f => {
    appRow += `<td><select class="tbl-select" data-id="${f.id}" data-type="app"><option value="">Seç...</option><option>Sol Kenar</option><option>Sağ Kenar</option><option>Üst Kenar</option><option>Alt Kenar</option></select></td>`;
    if (showLine) lineRow += `<td><select class="tbl-select" data-id="${f.id}" data-type="dirLine"><option value="">Seç...</option><option>Yatay</option><option>Düşey</option><option>Eğik</option></select></td>`;
    if (showDir) dirRow += `<td><select class="tbl-select" data-id="${f.id}" data-type="dir"><option value="">Seç...</option><option>Doğu</option><option>Batı</option><option>Kuzey</option><option>Güney</option><option>Kuzeydoğu</option><option>Kuzeybatı</option><option>Güneydoğu</option><option>Güneybatı</option></select></td>`;
    magRow += `<td><input type="number" inputmode="decimal" step="0.1" min="0" max="20" class="tbl-input" data-id="${f.id}" data-type="mag" placeholder="N"></td>`;
  });
  appRow += '<td><select class="tbl-select" data-type="netApp"><option value="">Seç...</option><option value="Merkez">Cismin Merkezi</option></select></td>';
  if (showLine) lineRow += '<td><select class="tbl-select" data-type="netDirLine"><option value="">Seç...</option><option value="Bileşke Eksen">Bileşke Eksen</option></select></td></tr>';
  if (showDir) {
    const nc = getCardinalDirection(state.netAngleDeg);
    dirRow += `<td><select class="tbl-select" data-type="netDir"><option value="">Seç...</option><option value="${nc}">${nc}</option><option>Doğu</option><option>Batı</option><option>Kuzey</option><option>Güney</option></select></td></tr>`;
  }
  magRow += '<td><input type="number" inputmode="decimal" step="0.1" min="0" class="tbl-input" data-type="netMag" placeholder="N"></td>';

  tbody.innerHTML = `${appRow}</tr>${lineRow}${dirRow}${magRow}</tr>
    <tr><th>Kuvvetin Etkisi</th><td colspan="${af.length + 1}" style="font-weight:800;color:#0d47a1;background:#e3f2fd">Simülasyon gözlemine göre etkisini belirleyin</td></tr>`;
}

document.getElementById('check-table-btn').addEventListener('click', () => {
  const af = state.forces.filter(f => f.active && f.mag > 0);
  let ok = 0, total = 0;
  document.querySelectorAll('.tbl-select, .tbl-input').forEach(el => {
    total++;
    const type = el.getAttribute('data-type'), fId = el.getAttribute('data-id');
    const v = el.value.trim().toLowerCase();
    const f = af.find(i => i.id === fId);
    let good = false;
    if (type === 'app' && f) good = v === (f.edge === 'left' ? 'sol kenar' : f.edge === 'right' ? 'sağ kenar' : f.edge === 'top' ? 'üst kenar' : 'alt kenar');
    else if (type === 'dirLine' && f) good = v === ((f.angleDeg === 0 || f.angleDeg === 180 || f.angleDeg === 360) ? 'yatay' : (f.angleDeg === 90 || f.angleDeg === 270) ? 'düşey' : 'eğik');
    else if (type === 'dir' && f) good = v === getCardinalDirection(f.angleDeg).toLowerCase();
    else if (type === 'mag' && f) good = v !== '' && Number(v) === f.mag;
    else if (type === 'netApp') good = v === 'merkez';
    else if (type === 'netDirLine') good = v.includes('bileşke') || v.includes('eksen');
    else if (type === 'netDir') good = v === getCardinalDirection(state.netAngleDeg).toLowerCase();
    else if (type === 'netMag') good = v !== '' && Math.abs(Number(v) - state.netForceMag) <= 0.1;
    el.classList.remove('cell-correct', 'cell-wrong');
    el.classList.add(good ? 'cell-correct' : 'cell-wrong');
    if (good) ok++;
  });
  const fb = document.getElementById('table-feedback');
  if (ok === total) { fb.style.color = '#2e7d32'; fb.textContent = '🎉 Harika! Tüm yanıtlar doğru.'; }
  else { fb.style.color = '#d84315'; fb.textContent = `⚠️ ${ok}/${total} doğru. Gözden geçirin.`; }
});

const modalPanel = document.getElementById('module-modal-panel');
const panelTitle = document.getElementById('mod-panel-title');
const panelBody = document.getElementById('mod-panel-body');

function openModule(id) {
  state.activeModule = id;
  modalPanel.style.display = 'flex';

  if (id === 1) {
    panelTitle.textContent = 'Konu Modülü 1: Kuvvetin 4 Temel Elemanı (FB.6.2.1)';
    panelBody.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0;font-weight:600;color:#1b5e20">Bir kuvvet vektörünün tam olarak tanımlanabilmesi için 4 temel unsura ihtiyaç vardır:</p>
      <div class="elements-grid">
        <div class="element-card"><h4>1. Uygulama Noktası</h4><p>Kuvvetin cisme temas ettiği kenar çizgileridir (Sol, sağ, üst, alt kenar).</p></div>
        <div class="element-card"><h4>2. Doğrultu</h4><p>Kuvvetin etki ettiği eksendir (Yatay / Düşey).</p></div>
        <div class="element-card"><h4>3. Yön</h4><p>Kuvvetin uygulandığı coğrafi taraftır (Doğu, Batı, Kuzey, Güney).</p></div>
        <div class="element-card"><h4>4. Büyüklük</h4><p>Kuvvetin şiddetidir; Newton (N) birimiyle ifade edilir.</p></div>
      </div></div>`;
  } else if (id === 2) {
    panelTitle.textContent = 'Konu Modülü 2: Bileşke (Net) Kuvvet (FB.6.2.1)';
    panelBody.innerHTML = `<p style="margin:0;font-weight:600;color:#0d47a1"><b>Bileşke Kuvvet:</b> Birden fazla kuvvetin yaptığı tek etki (F<sub>net</sub>).</p>`;
  } else if (id === 3) {
    panelTitle.textContent = 'Konu Modülü 3: Dengelenmiş ve Dengelenmemiş Kuvvetler (FB.6.2.2)';
    panelBody.innerHTML = `<p style="margin:0;font-weight:600;color:#2e7d32">
      <b>Dengelenmiş (F<sub>net</sub> = 0):</b> Cisim durgun kalır veya sabit hızla hareket eder.<br>
      <b>Dengelenmemiş (F<sub>net</sub> ≠ 0):</b> Cisim hızlanır.</p>`;
  } else if (id === 4) {
    panelTitle.textContent = 'Konu Modülü 4: Ölçme ve Değerlendirme (FB.6.2.1 & FB.6.2.2)';
    const qList = [
      { id: 'q1', title: '1. Soru (Bileşke Kuvvet)', text: `Sahnedeki ${state.mass} kg kütleli cismin kenarlarına uyguladığınız net kuvvet ${state.netForceMag} N (${getCardinalDirection(state.netAngleDeg)}) iken cismin hareketini açıklayınız.` },
      { id: 'q2', title: '2. Soru (Sürtünme Etkisi)', text: 'Sürtünme katsayısını (μ) artırdığınızda cismin hareketini sürdürmek için gereken kuvvet nasıl değişti?' },
      { id: 'q3', title: '3. Soru (Dengelenmiş Kuvvetler)', text: 'Net kuvvetin sıfır olduğu (F<sub>net</sub> = 0) durumda cismin hızı hakkında ne söyleyebilirsiniz?' }
    ];
    let h = `<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <p style="margin:0;font-weight:700;color:#0d47a1">Değerlendirme Soruları:</p>
        <button id="btn-toggle-teacher" style="padding:6px 10px;font-size:12px;font-weight:700;background:#37474f;color:#fff;border:none;border-radius:4px;cursor:pointer">${state.assessment.teacherView ? 'Öğrenci Görünümüne Dön' : 'Öğretmen Görünümü (Rubrik)'}</button>
      </div>`;
    qList.forEach(q => {
      const val = state.assessment.answers[q.id] || '';
      h += `<div style="background:#f5f5f5;border:1px solid #cfd8dc;padding:6px;border-radius:6px;margin-top:4px">
        <div style="font-weight:700;color:#333;margin-bottom:2px">${q.title}</div>
        <p style="margin:0 0 4px;font-size:12px;color:#455a64">${q.text}</p>
        <textarea class="assess-textarea" data-qid="${q.id}" style="width:100%;height:38px;border:1px solid #90a4ae;border-radius:4px;padding:3px;font-size:12px" placeholder="Yanıtınızı buraya yazınız...">${val}</textarea>
        ${state.assessment.teacherView ? '<div style="margin-top:3px;padding:4px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:4px;font-size:11px;color:#1b5e20"><b>Örnek Beklenen Yanıt:</b> Öğrenci yön ve büyüklük ilişkilerini açıklamalıdır.</div>' : ''}
      </div>`;
    });
    h += `<div style="display:flex;gap:6px;margin-top:6px">
      <button id="btn-save-assess" style="background:#2e7d32;color:#fff;border:none;padding:8px 12px;border-radius:4px;font-weight:700;cursor:pointer;font-size:12px">Yanıtlarımı Kaydet</button>
      <button id="btn-print-assess" style="background:#1565c0;color:#fff;border:none;padding:8px 12px;border-radius:4px;font-weight:700;cursor:pointer;font-size:12px">Yazdır / Rapor Al</button>
    </div></div>`;
    panelBody.innerHTML = h;

    document.getElementById('btn-toggle-teacher').addEventListener('click', () => {
      state.assessment.teacherView = !state.assessment.teacherView;
      openModule(4);
    });
    document.querySelectorAll('.assess-textarea').forEach(ta => {
      ta.addEventListener('input', e => { state.assessment.answers[e.target.getAttribute('data-qid')] = e.target.value; });
    });
    document.getElementById('btn-save-assess').addEventListener('click', () => alert('Yanıtlarınız oturum belleğine başarıyla kaydedildi.'));
    document.getElementById('btn-print-assess').addEventListener('click', () => window.print());
  }
}

[1, 2, 3, 4].forEach(n => document.getElementById('mod-btn-' + n).addEventListener('click', () => openModule(n)));
document.getElementById('mod-panel-close').addEventListener('click', () => { modalPanel.style.display = 'none'; state.activeModule = null; });

document.getElementById('btn-add-force').addEventListener('click', () => {
  state.forces.push({
    id: 'f_' + Date.now(), active: true, mag: DEFAULT_FORCE, angleDeg: 0, edge: 'left', edgeRatio: 0.5,
    color: PALETTE[state.forces.length % PALETTE.length].hex
  });
  stepPhysics(0); renderForceTable(); drawScene();
});

document.getElementById('btn-play-pause').addEventListener('click', () => { state.running = !state.running; syncPlayBtn(); });

document.getElementById('btn-reset').addEventListener('click', () => {
  state.running = true; state.velocity = 0; state.groundOffset = 0; state.forces = [];
  syncPlayBtn(); stepPhysics(0); renderForceTable(); drawScene();
});

document.getElementById('btn-clear-vectors').addEventListener('click', () => {
  state.forces = []; state.velocity = 0; state.groundOffset = 0;
  stepPhysics(0); renderForceTable(); drawScene();
});

document.getElementById('slider-friction').addEventListener('input', (e) => {
  state.mu = Number(e.target.value);
  document.getElementById('mu-label').textContent = `μ = ${state.mu.toFixed(3)}`;
  stepPhysics(0); drawScene();
});

document.getElementById('chk-forces').addEventListener('change', e => { state.showForces = e.target.checked; drawScene(); });
document.getElementById('chk-net').addEventListener('change', e => { state.showNetForce = e.target.checked; drawScene(); });
document.getElementById('chk-values').addEventListener('change', e => { state.showValuesOnHover = e.target.checked; drawScene(); });
document.getElementById('chk-Direction').addEventListener('change', e => { state.showDirectionLine = e.target.checked; renderForceTable(); drawScene(); });
document.getElementById('chk-direction-var').addEventListener('change', e => { state.showDirectionVar = e.target.checked; renderForceTable(); });
document.getElementById('chk-masses').addEventListener('change', e => { state.showMasses = e.target.checked; drawScene(); });
document.getElementById('chk-speed').addEventListener('change', e => { state.showSpeedGauge = e.target.checked; drawScene(); });
document.getElementById('chk-freedir').addEventListener('change', e => { state.freeDirection = e.target.checked; });

document.querySelectorAll('.obj-item').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.obj-item').forEach(el => el.classList.remove('active'));
    card.classList.add('active');
    state.objectType = card.getAttribute('data-type');
    state.mass = Number(card.getAttribute('data-mass'));
    document.getElementById('active-obj-label').textContent = `${card.getAttribute('data-name')} (${state.mass} kg)`;
    stepPhysics(0); drawScene();
  });
});

document.getElementById('btn-mode-obs').addEventListener('click', () => {
  state.tableMode = 'observation';
  document.getElementById('btn-mode-obs').classList.add('active');
  document.getElementById('btn-mode-stu').classList.remove('active');
  document.getElementById('check-table-btn').style.display = 'none';
  renderForceTable();
});
document.getElementById('btn-mode-stu').addEventListener('click', () => {
  state.tableMode = 'student';
  document.getElementById('btn-mode-stu').classList.add('active');
  document.getElementById('btn-mode-obs').classList.remove('active');
  document.getElementById('check-table-btn').style.display = 'inline-block';
  renderForceTable();
});

function animateLoop() {
  if (state.running) stepPhysics(1 / 60);
  drawScene();
  requestAnimationFrame(animateLoop);
}

window.onload = () => { stepPhysics(0); renderForceTable(); requestAnimationFrame(animateLoop); };
</script>
</body>
</html>
